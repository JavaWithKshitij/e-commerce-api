server:
  port: 9082
spring:
  application:
    name: order-service

    datasource:
      url: jdbc:h2:file:./data/orderdb
      driver-class-name: org.h2.Driver
      username: sa
      password:

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      database-platform: org.hibernate.dialect.H2Dialect

product:
  service:
    url: http://localhost:9081  # Product service URL

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
